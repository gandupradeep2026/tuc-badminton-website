# Render Blueprint Specification for TU Chemnitz Badminton API
# Free Tier Web Service connected directly to GitHub repository
services:
  - type: web
    name: tuc-badminton-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_EMAIL
        value: gandupradeep2026@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://gandupradeep2026.github.io
      - key: GMAIL_APP_PASSWORD
        sync: false
