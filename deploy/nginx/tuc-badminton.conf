# Nginx site for the TU Chemnitz badminton community portal
# Install: see deploy/DEPLOY.md. Adjust WEB_ROOT below to the folder that holds frontend/dist on the server.

server {
    listen 80;
    listen [::]:80;
    server_name 130-61-242-26.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 130-61-242-26.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/130-61-242-26.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/130-61-242-26.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WEB_ROOT: the built frontend (frontend/dist)
    root /var/www/tuc-badminton;

    # No version number in the Server header
    server_tokens off;

    # Compression: cuts the JS/CSS transfer by about 70 %
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 16m;

    # Security headers for every response (repeated in locations that set their own add_header)
    include /etc/nginx/snippets/tuc-security-headers.conf;

    # API and uploads: Node.js backend on the same host
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Express sends these for local development: keep only the Nginx copies
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Powered-By;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Powered-By;
    }

    # Fingerprinted build files never change: cache for a year
    location /assets/ {
        include /etc/nginx/snippets/tuc-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell: always revalidate so a new deploy shows at once
    location = / {
        include /etc/nginx/snippets/tuc-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/tuc-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The app routes with #hash, so any other unknown path is a real 404
    location / {
        try_files $uri =404;
    }
}
